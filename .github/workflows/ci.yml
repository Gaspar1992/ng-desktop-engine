name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Linux GTK4 + Xvfb + Angular 22
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Angular & Tooling dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Oxfmt)
        run: pnpm run format:check

      - name: Lint Angular & TypeScript (Oxlint + Angular ESLint)
        run: pnpm run lint

      - name: Run Angular & Docs Portal Vitest suites with V8 coverage thresholds
        run: pnpm run test:coverage

      - name: Build Angular & Native Bundle (.ngb)
        run: pnpm run build

      - name: Build @ng-desktop/* APF packages
        run: pnpm run build:packages

      - name: Verify packed npm tarballs in external consumer
        run: pnpm run test:pack

      - name: Install Linux native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 \
            libadwaita-1-0 \
            libjavascriptcoregtk-6.0-1 \
            libsoup-3.0-0 \
            libsqlite3-0 \
            xvfb \
            xauth

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, integration & strict E2E tests (Headless + Xvfb GTK4 Display)
        env:
          NG_DESKTOP_GPU_BACKEND: 'software'
          NG_E2E_REQUIRE_FULL: '1'
        run: xvfb-run -a cargo test --verbose -- --test-threads=1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Enforce Rust line coverage threshold (cargo-llvm-cov)
        env:
          NG_DESKTOP_GPU_BACKEND: 'software'
          NG_E2E_REQUIRE_FULL: '1'
        run: xvfb-run -a cargo llvm-cov --summary-only --fail-under-lines 75 -- --test-threads=1

      - name: Build Docs Portal & TypeScript/Rust API Reference
        run: |
          pnpm run docs:site
          test -s dist/ng-desktop-docs/browser/index.html
          test -s dist/ng-desktop-docs/browser/404.html
          test -f dist/ng-desktop-docs/browser/.nojekyll
          test -s dist/ng-desktop-docs/browser/api-ts/index.html
          test -s dist/ng-desktop-docs/browser/api-rust/index.html
          test -s dist/ng-desktop-docs/browser/api-rust/ng_native_engine/index.html

      - name: Stage multi-OS distribution packages & build real Linux .deb installer
        run: |
          cargo run -- --package-all
          cargo run -- --installer=deb --strict-installer
          DEB_FILE="$(ls dist/ng-linux-counter/packages/ng-linux-counter_*.deb | head -n1)"
          test -s "${DEB_FILE}"
          dpkg-deb --info "${DEB_FILE}"
          dpkg-deb --contents "${DEB_FILE}"

  cross-os-matrix:
    name: Native ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows 11 (WinUI 3)
          - os: macos-latest
            label: macOS (AppKit Cocoa)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies & compile full Angular + native .ngb bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Run Angular & TypeScript unit tests (Vitest - ${{ matrix.label }})
        run: pnpm run test --watch=false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy linter (${{ matrix.label }})
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit, integration & strict E2E tests (${{ matrix.label }})
        env:
          NG_E2E_REQUIRE_FULL: '1'
        run: cargo test --verbose

      - name: Stage distribution packages (${{ matrix.label }})
        run: cargo run -- --package-all

      - name: Build and verify native Windows .msix installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo run -- --installer=msix --strict-installer
          $msix = Get-ChildItem "dist/ng-linux-counter/packages/ng-linux-counter_*.msix" | Select-Object -First 1
          if (-not $msix -or $msix.Length -le 0) { throw "Missing or empty .msix installer" }
          Write-Host "Verified MSIX: $($msix.FullName) ($($msix.Length) bytes)"

      - name: Build and verify native macOS .dmg installer
        if: matrix.os == 'macos-latest'
        run: |
          cargo run -- --installer=dmg --strict-installer
          DMG_FILE="$(ls dist/ng-linux-counter/packages/ng-linux-counter-*.dmg | head -n1)"
          test -s "${DMG_FILE}"
          hdiutil verify "${DMG_FILE}"
