name: Publish npm (engine binaries x5 + libs)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to publish (e.g. v0.4.0)'
        required: true

permissions:
  contents: read

jobs:
  build-engine:
    name: Engine ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, bin: ng-native-engine }
          - { os: ubuntu-24.04-arm, target: linux-arm64, bin: ng-native-engine }
          - { os: windows-latest, target: win32-x64, bin: ng-native-engine.exe }
          - { os: macos-latest, target: darwin-arm64, bin: ng-native-engine }
          - { os: macos-15-intel, target: darwin-x64, bin: ng-native-engine }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK build deps (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libjavascriptcoregtk-6.0-dev libsoup-3.0-dev libsqlite3-dev
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build-engine
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm provenance / OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve version
        run: |
          RAW="${{ inputs.tag_name || github.ref_name }}"
          echo "VER=${RAW#v}" >> "$GITHUB_ENV"
      - name: Stage engine packages (binary inside each npm package)
        run: |
          for t in linux-x64:ng-native-engine linux-arm64:ng-native-engine win32-x64:ng-native-engine.exe darwin-arm64:ng-native-engine darwin-x64:ng-native-engine; do
            target="${t%%:*}"; bin="${t##*:}"
            node scripts/build-engine-packages.mjs --target="$target" --binary="artifacts/engine-$target/$bin" --version="$VER"
          done
      - name: Build libs
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:packages -- --version="$VER"
      - name: Publish (engines first, then libs)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          for d in dist/engine-packages/*/ dist/packages/platform-native dist/packages/forms-native dist/packages/router-native dist/packages/http-native dist/packages/desktop-native dist/packages/server-native dist/packages/builders-native; do
            name=$(node -p "require('./$d/package.json').name")
            if npm view "$name@$VER" version >/dev/null 2>&1; then echo "skip $name@$VER"; continue; fi
            (cd "$d" && npm publish --access public)
          done
