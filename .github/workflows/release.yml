name: Release Multi-OS Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version to build and publish (e.g. v0.4.0)'
        required: true
        default: 'v0.4.0'

permissions:
  contents: write

jobs:
  build-os-bundles:
    name: Build ${{ matrix.target }} (Engine + @ng-desktop/* Packages)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            platform: linux
            dir_name: engine-linux-x64-gnu
            archive: ng-desktop-engine-linux-x86_64.tar.gz
            pack_libs: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            platform: linux
            dir_name: engine-linux-arm64-gnu
            archive: ng-desktop-engine-linux-arm64.tar.gz
            pack_libs: false
          - os: windows-latest
            target: win32-x64
            platform: windows
            dir_name: engine-win32-x64-msvc
            archive: ng-desktop-engine-windows-x86_64.zip
            pack_libs: false
          - os: macos-latest
            target: darwin-arm64
            platform: macos
            dir_name: engine-darwin-arm64
            archive: ng-desktop-engine-macos-arm64.tar.gz
            pack_libs: false
          - os: macos-15-intel
            target: darwin-x64
            platform: macos
            dir_name: engine-darwin-x64
            archive: ng-desktop-engine-macos-x86_64.tar.gz
            pack_libs: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: matrix.pack_libs
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (with pnpm cache for libraries)
        if: matrix.pack_libs
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Node.js (engine-only staging)
        if: ${{ !matrix.pack_libs }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve release version dynamically
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ inputs.tag_name }}"
          else
            RAW_TAG="${GITHUB_REF_NAME:-}"
          fi
          VER="${RAW_TAG#v}"
          if [ -z "${VER}" ]; then
            VER="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          fi
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Install dependencies & build APF packages
        if: matrix.pack_libs
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:packages -- --version="${APP_VERSION}"

      - name: Install Linux native libraries (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 \
            libadwaita-1-0 \
            libjavascriptcoregtk-6.0-1 \
            libsoup-3.0-0 \
            libsqlite3-0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release engine binary
        run: cargo build --release --locked

      - name: Package Linux (Engine tarball + Engine npm package + APF Angular .tgz packages)
        if: matrix.platform == 'linux'
        run: |
          VER="${APP_VERSION}"
          mkdir -p release-out

          # 1. Standalone Linux Engine archive
          tar -czf "release-out/${{ matrix.archive }}" -C target/release ng-native-engine

          # 2. Stage & pack platform npm binary package (@ng-desktop/engine-*)
          node scripts/build-engine-packages.mjs --target="${{ matrix.target }}" --binary=target/release/ng-native-engine --version="${VER}"
          (cd "dist/engine-packages/${{ matrix.dir_name }}" && npm pack --pack-destination "../../../release-out")

          # 3. Pack all 7 compiled APF/ESM Angular 22+ libraries (@ng-desktop/*) on the primary Linux leg
          if [ "${{ matrix.pack_libs }}" = "true" ]; then
            for pkg in platform-native forms-native router-native http-native desktop-native server-native builders-native; do
              (cd "dist/packages/${pkg}" && npm pack --pack-destination "../../../release-out")
            done
          fi
          ls -lh release-out/

      - name: Package Windows (Engine .zip + Engine npm package)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $VER = $env:APP_VERSION
          New-Item -ItemType Directory -Force -Path "release-out" | Out-Null

          # 1. Stage & pack platform npm binary package (@ng-desktop/engine-win32-x64-msvc)
          node scripts/build-engine-packages.mjs --target="${{ matrix.target }}" --binary=target/release/ng-native-engine.exe --version="$VER"
          Push-Location "dist/engine-packages/${{ matrix.dir_name }}"
          npm pack --pack-destination "../../../release-out"
          Pop-Location

          # 2. Standalone Windows Engine archive
          Compress-Archive -Path "target/release/ng-native-engine.exe" -DestinationPath "release-out/${{ matrix.archive }}" -Force
          Get-ChildItem release-out

      - name: Package macOS (Engine tarball + Engine npm package)
        if: matrix.platform == 'macos'
        run: |
          VER="${APP_VERSION}"
          mkdir -p release-out

          # 1. Stage & pack platform npm binary package (@ng-desktop/engine-darwin-*)
          node scripts/build-engine-packages.mjs --target="${{ matrix.target }}" --binary=target/release/ng-native-engine --version="${VER}"
          (cd "dist/engine-packages/${{ matrix.dir_name }}" && npm pack --pack-destination "../../../release-out")

          # 2. Standalone macOS Engine archive
          tar -czf "release-out/${{ matrix.archive }}" -C target/release ng-native-engine
          ls -lh release-out/

      - name: Upload OS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release-out/*
          if-no-files-found: error

  publish-release:
    name: Publish Engine & Angular Packages Release
    needs: build-os-bundles
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download all OS release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version & generate structured release notes + checksums
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ inputs.tag_name }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          VER="${RAW_TAG#v}"
          ENGINE_TAG="v${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "engine_tag=${ENGINE_TAG}" >> "$GITHUB_OUTPUT"

          node scripts/generate-release-notes.mjs --version="${VER}" --out=ENGINE_RELEASE_NOTES.md

          cd artifacts
          sha256sum ng-desktop-engine-*.tar.gz ng-desktop-engine-*.zip ng-desktop-*.tgz > SHA256SUMS-engine.txt
          cat SHA256SUMS-engine.txt

      - name: Generate Sigstore SLSA build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/ng-desktop-*.tgz
            artifacts/ng-desktop-engine-*.tar.gz
            artifacts/ng-desktop-engine-*.zip

      - name: Publish NgDesktop Engine & Angular 22+ Packages Release (${{ steps.meta.outputs.engine_tag }})
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.engine_tag }}
          name: 'NgDesktop Engine & Angular 22+ Packages v${{ steps.meta.outputs.version }}'
          body_path: ENGINE_RELEASE_NOTES.md
          files: |
            artifacts/ng-desktop-platform-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-forms-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-router-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-http-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-desktop-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-server-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-builders-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-linux-x64-gnu-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-linux-arm64-gnu-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-win32-x64-msvc-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-darwin-arm64-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-darwin-x64-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-linux-x86_64.tar.gz
            artifacts/ng-desktop-engine-linux-arm64.tar.gz
            artifacts/ng-desktop-engine-windows-x86_64.zip
            artifacts/ng-desktop-engine-macos-arm64.tar.gz
            artifacts/ng-desktop-engine-macos-x86_64.tar.gz
            artifacts/SHA256SUMS-engine.txt

  publish-npm:
    name: Publish @ng-desktop/* & Prebuilt Engine Packages to npm (OIDC)
    needs: publish-release
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js (without registry-url to preserve OIDC handshake)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          NPM_CUR="$(npm --version)"
          node -e "
            const [maj, min, pat] = process.argv[1].split('.').map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) process.exit(42);
          " "${NPM_CUR}" || npm install -g npm@latest
          npm --version

      - name: Download release tarballs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish via OIDC Trusted Publishing (or verify offline until enabled)
        env:
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          shopt -s nullglob
          ENGINE_TARBALLS=(artifacts/ng-desktop-engine-*.tgz)
          LIB_TARBALLS=(
            artifacts/ng-desktop-platform-*.tgz
            artifacts/ng-desktop-forms-*.tgz
            artifacts/ng-desktop-router-*.tgz
            artifacts/ng-desktop-http-*.tgz
            artifacts/ng-desktop-desktop-*.tgz
            artifacts/ng-desktop-server-*.tgz
            artifacts/ng-desktop-builders-*.tgz
          )
          test "${#ENGINE_TARBALLS[@]}" -eq 5
          test "${#LIB_TARBALLS[@]}" -eq 7
          if [ "${NPM_TRUSTED_PUBLISHING:-false}" = "true" ]; then
            for tgz in "${ENGINE_TARBALLS[@]}" "${LIB_TARBALLS[@]}"; do
              PKG_INFO="$(tar -xOf "./${tgz}" package/package.json | node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync(0, 'utf8'));
                process.stdout.write(p.name + '\t' + p.version);
              ")"
              PKG_NAME="${PKG_INFO%%$'\t'*}"
              PKG_VER="${PKG_INFO#*$'\t'}"
              if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
                echo "[Publish Skip] ${PKG_NAME}@${PKG_VER} already published on npm."
              else
                npm publish "./${tgz}" --provenance --access public
              fi
            done
          else
            echo "vars.NPM_TRUSTED_PUBLISHING != 'true'; verifying tarball manifests offline (enable OIDC in npmjs.com + 'gh variable set NPM_TRUSTED_PUBLISHING --body true')."
            for tgz in "${ENGINE_TARBALLS[@]}" "${LIB_TARBALLS[@]}"; do
              tar -tzf "./${tgz}" >/dev/null
              tar -xOf "./${tgz}" package/package.json | node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync(0, 'utf8'));
                if (!pkg.name || !pkg.version) throw new Error('Invalid tarball package.json');
                process.stdout.write('[Verified Tarball] ' + pkg.name + '@' + pkg.version + '\n');
              "
            done
          fi

  publish-crates:
    name: Publish ng-native-engine Crate to crates.io (OIDC)
    needs: publish-release
    runs-on: ubuntu-24.04
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io via OIDC Trusted Publishing
        if: ${{ vars.CRATES_TRUSTED_PUBLISHING == 'true' }}
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish via OIDC (or verify cargo publish --dry-run until enabled)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
          CRATES_TRUSTED_PUBLISHING: ${{ vars.CRATES_TRUSTED_PUBLISHING }}
        run: |
          if [ "${CRATES_TRUSTED_PUBLISHING:-false}" = "true" ]; then
            test -n "${CARGO_REGISTRY_TOKEN:-}"
            cargo publish --locked
          else
            echo "vars.CRATES_TRUSTED_PUBLISHING != 'true'; verifying crate package cleanly."
            cargo publish --dry-run --allow-dirty
          fi
