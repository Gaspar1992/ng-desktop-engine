name: Release Multi-OS Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version to build and publish (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build-os-bundles:
    name: Build ${{ matrix.platform }} (.deb / .exe / .dmg + Engine + Packages)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Resolve release version dynamically
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ inputs.tag_name }}"
          else
            RAW_TAG="${GITHUB_REF_NAME:-}"
          fi
          VER="${RAW_TAG#pokedex-demo-}"
          VER="${VER#v}"
          if [ -z "${VER}" ]; then
            VER="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          fi
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "NG_DESKTOP_APP_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Install dependencies & build Angular + Native .ngb + APF packages
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run build:packages

      - name: Install Linux native libraries (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libgtk-4-1 \
            libadwaita-1-0 \
            libjavascriptcoregtk-6.0-1 \
            libsoup-3.0-0 \
            libsqlite3-0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release engine binary & stage least-privilege distribution packages
        run: |
          cargo build --release
          cargo run --release -- --package-all --version="${NG_DESKTOP_APP_VERSION}"

      - name: Package Linux (.deb installer + Engine tarball + APF Angular .tgz packages)
        if: matrix.platform == 'linux'
        run: |
          VER="${APP_VERSION}"
          mkdir -p release-out

          # 1. Build real installable Debian package: pokedex-demo_<ver>_amd64.deb
          DEB_ROOT="dist/ng-linux-counter/packages/deb"
          mkdir -p "${DEB_ROOT}/usr/bin"
          mkdir -p "${DEB_ROOT}/usr/share/ng-linux-counter"
          mkdir -p "${DEB_ROOT}/usr/share/icons"
          cp target/release/ng-native-engine "${DEB_ROOT}/usr/bin/ng-linux-counter"
          chmod 0755 "${DEB_ROOT}/usr/bin/ng-linux-counter"
          cp dist/ng-linux-counter/main.ngb "${DEB_ROOT}/usr/share/ng-linux-counter/main.ngb"
          cp dist/ng-linux-counter/permissions.manifest.json "${DEB_ROOT}/usr/share/ng-linux-counter/permissions.manifest.json"
          cp dist/ng-linux-counter/ng-desktop.runtime.json "${DEB_ROOT}/usr/share/ng-linux-counter/ng-desktop.runtime.json"
          if [ -d "dist/ng-linux-counter/icons/hicolor" ]; then
            cp -r dist/ng-linux-counter/icons/hicolor "${DEB_ROOT}/usr/share/icons/"
          fi
          chmod 0755 "${DEB_ROOT}/DEBIAN"
          chmod 0644 "${DEB_ROOT}/DEBIAN/control"
          chmod 0644 "${DEB_ROOT}/etc/apparmor.d/ng-linux-counter"
          test -f "${DEB_ROOT}/usr/share/ng-linux-counter/permissions.manifest.json"
          test -f "${DEB_ROOT}/usr/share/ng-linux-counter/ng-desktop.runtime.json"
          test -f "${DEB_ROOT}/etc/apparmor.d/ng-linux-counter"
          dpkg-deb --build --root-owner-group "${DEB_ROOT}" "release-out/pokedex-demo_${VER}_amd64.deb"

          # 2. Build standalone Linux Engine archive: ng-desktop-engine-linux-x86_64.tar.gz
          cp target/release/ng-native-engine dist/ng-linux-counter/ng-native-engine
          chmod +x dist/ng-linux-counter/ng-native-engine
          tar -czf "release-out/ng-desktop-engine-linux-x86_64.tar.gz" -C target/release ng-native-engine

          # 3. Stage & pack platform npm binary package (@ng-desktop/engine-linux-x64-gnu)
          node scripts/build-engine-packages.mjs --target=linux-x64 --binary=target/release/ng-native-engine --version="${VER}"
          (cd "dist/engine-packages/engine-linux-x64-gnu" && npm pack --pack-destination "../../../release-out")

          # 4. Pack individual compiled APF Angular 22+ libraries (@ng-desktop/*) as .tgz tarballs
          for pkg in platform-native forms-native router-native http-native desktop-native builders-native; do
            (cd "dist/packages/${pkg}" && npm pack --pack-destination "../../../release-out")
          done
          ls -lh release-out/

      - name: Package Windows (Standalone .exe executable + Engine .zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $VER = $env:APP_VERSION
          New-Item -ItemType Directory -Force -Path "release-out" | Out-Null

          # 1. Standalone self-contained Windows executable: pokedex-demo-<ver>-windows-x64.exe
          Copy-Item "target/release/ng-native-engine.exe" "release-out/pokedex-demo-${VER}-windows-x64.exe" -Force

          # 2. Stage & pack platform npm binary package (@ng-desktop/engine-win32-x64-msvc)
          node scripts/build-engine-packages.mjs --target=win32-x64 --binary=target/release/ng-native-engine.exe --version="${VER}"
          Push-Location "dist/engine-packages/engine-win32-x64-msvc"
          npm pack --pack-destination "../../../release-out"
          Pop-Location

          # 3. Engine + WinUI 3 MSIX package archive: ng-desktop-engine-windows-x86_64.zip
          Copy-Item "target/release/ng-native-engine.exe" "dist/ng-linux-counter/packages/windows/ng-linux-counter.exe" -Force
          Copy-Item "dist/ng-linux-counter/main.ngb" "dist/ng-linux-counter/packages/windows/main.ngb" -Force
          Copy-Item "dist/ng-linux-counter/permissions.manifest.json" "dist/ng-linux-counter/packages/windows/permissions.manifest.json" -Force
          Copy-Item "dist/ng-linux-counter/ng-desktop.runtime.json" "dist/ng-linux-counter/packages/windows/ng-desktop.runtime.json" -Force
          Compress-Archive -Path "dist/ng-linux-counter/packages/windows/*" -DestinationPath "release-out/ng-desktop-engine-windows-x86_64.zip" -Force
          Get-ChildItem release-out

      - name: Package macOS (.dmg Disk Image + Engine tarball)
        if: matrix.platform == 'macos'
        run: |
          VER="${APP_VERSION}"
          mkdir -p release-out

          # 1. Populate macOS .app bundle and build real .dmg disk image: pokedex-demo-<ver>-macos-arm64.dmg
          APP_DIR="dist/ng-linux-counter/packages/macos/ng-linux-counter.app"
          cp target/release/ng-native-engine "${APP_DIR}/Contents/MacOS/ng-linux-counter"
          cp dist/ng-linux-counter/main.ngb "${APP_DIR}/Contents/Resources/main.ngb"
          cp dist/ng-linux-counter/permissions.manifest.json "${APP_DIR}/Contents/Resources/permissions.manifest.json"
          cp dist/ng-linux-counter/ng-desktop.runtime.json "${APP_DIR}/Contents/Resources/ng-desktop.runtime.json"
          chmod +x "${APP_DIR}/Contents/MacOS/ng-linux-counter"
          chmod +x "${APP_DIR}/Contents/MacOS/run-appkit.sh"
          hdiutil create \
            -volname "Pokedex Nacional" \
            -srcfolder "dist/ng-linux-counter/packages/macos" \
            -ov \
            -format UDZO \
            "release-out/pokedex-demo-${VER}-macos-arm64.dmg"

          # 2. Stage & pack platform npm binary package (@ng-desktop/engine-darwin-arm64)
          node scripts/build-engine-packages.mjs --target=darwin-arm64 --binary=target/release/ng-native-engine --version="${VER}"
          (cd "dist/engine-packages/engine-darwin-arm64" && npm pack --pack-destination "../../../release-out")

          # 3. Standalone macOS Engine archive: ng-desktop-engine-macos-arm64.tar.gz
          tar -czf "release-out/ng-desktop-engine-macos-arm64.tar.gz" -C target/release ng-native-engine
          ls -lh release-out/

      - name: Upload OS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-out/*
          if-no-files-found: error

  publish-release:
    name: Publish Separated Engine & Pokédex Demo Releases
    needs: build-os-bundles
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download all OS release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version & generate structured release notes + checksums
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ inputs.tag_name }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          VER="${RAW_TAG#pokedex-demo-}"
          VER="${VER#v}"
          ENGINE_TAG="v${VER}"
          DEMO_TAG="pokedex-demo-v${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "engine_tag=${ENGINE_TAG}" >> "$GITHUB_OUTPUT"
          echo "demo_tag=${DEMO_TAG}" >> "$GITHUB_OUTPUT"

          node scripts/generate-release-notes.mjs --kind=engine --version="${VER}" --out=ENGINE_RELEASE_NOTES.md
          node scripts/generate-release-notes.mjs --kind=demo --version="${VER}" --out=DEMO_RELEASE_NOTES.md

          cd artifacts
          sha256sum ng-desktop-engine-*.tar.gz ng-desktop-engine-*.zip ng-desktop-*.tgz > SHA256SUMS-engine.txt
          sha256sum pokedex-demo* > SHA256SUMS-demo.txt
          cat SHA256SUMS-engine.txt
          cat SHA256SUMS-demo.txt

      - name: Generate Sigstore SLSA build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/ng-desktop-*.tgz
            artifacts/ng-desktop-engine-*.tar.gz
            artifacts/ng-desktop-engine-*.zip
            artifacts/pokedex-demo*

      - name: Publish 1/2 — NgDesktop Engine & Angular 22+ Packages Release (${{ steps.meta.outputs.engine_tag }})
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.engine_tag }}
          name: 'NgDesktop Engine & Angular 22+ Packages v${{ steps.meta.outputs.version }}'
          body_path: ENGINE_RELEASE_NOTES.md
          files: |
            artifacts/ng-desktop-platform-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-forms-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-router-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-http-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-desktop-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-builders-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-linux-x64-gnu-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-win32-x64-msvc-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-darwin-arm64-${{ steps.meta.outputs.version }}.tgz
            artifacts/ng-desktop-engine-linux-x86_64.tar.gz
            artifacts/ng-desktop-engine-windows-x86_64.zip
            artifacts/ng-desktop-engine-macos-arm64.tar.gz
            artifacts/SHA256SUMS-engine.txt

      - name: Publish 2/2 — Pokédex Nacional Showcase Demo Release (${{ steps.meta.outputs.demo_tag }})
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.demo_tag }}
          name: 'Pokédex Nacional Desktop Showcase Demo v${{ steps.meta.outputs.version }} (.deb / .exe / .dmg)'
          body_path: DEMO_RELEASE_NOTES.md
          files: |
            artifacts/pokedex-demo_${{ steps.meta.outputs.version }}_amd64.deb
            artifacts/pokedex-demo-${{ steps.meta.outputs.version }}-windows-x64.exe
            artifacts/pokedex-demo-${{ steps.meta.outputs.version }}-macos-arm64.dmg
            artifacts/SHA256SUMS-demo.txt

  publish-npm:
    name: Publish @ng-desktop/* & Prebuilt Engine Packages to npm (OIDC)
    needs: publish-release
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js (without registry-url to preserve OIDC handshake)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          NPM_CUR="$(npm --version)"
          node -e "
            const [maj, min, pat] = process.argv[1].split('.').map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) process.exit(42);
          " "${NPM_CUR}" || npm install -g npm@latest
          npm --version

      - name: Download release tarballs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish via OIDC Trusted Publishing (or verify offline until enabled)
        env:
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          shopt -s nullglob
          ENGINE_TARBALLS=(artifacts/ng-desktop-engine-*.tgz)
          LIB_TARBALLS=(
            artifacts/ng-desktop-platform-*.tgz
            artifacts/ng-desktop-forms-*.tgz
            artifacts/ng-desktop-router-*.tgz
            artifacts/ng-desktop-http-*.tgz
            artifacts/ng-desktop-desktop-*.tgz
            artifacts/ng-desktop-builders-*.tgz
          )
          test "${#ENGINE_TARBALLS[@]}" -gt 0
          test "${#LIB_TARBALLS[@]}" -eq 6
          if [ "${NPM_TRUSTED_PUBLISHING:-false}" = "true" ]; then
            for tgz in "${ENGINE_TARBALLS[@]}" "${LIB_TARBALLS[@]}"; do
              npm publish "./${tgz}" --provenance --access public
            done
          else
            echo "vars.NPM_TRUSTED_PUBLISHING != 'true'; verifying tarball manifests offline (enable OIDC in npmjs.com + 'gh variable set NPM_TRUSTED_PUBLISHING --body true')."
            for tgz in "${ENGINE_TARBALLS[@]}" "${LIB_TARBALLS[@]}"; do
              tar -tzf "./${tgz}" >/dev/null
              tar -xOf "./${tgz}" package/package.json | node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync(0, 'utf8'));
                if (!pkg.name || !pkg.version) throw new Error('Invalid tarball package.json');
                process.stdout.write('[Verified Tarball] ' + pkg.name + '@' + pkg.version + '\n');
              "
            done
          fi

  publish-crates:
    name: Publish ng-native-engine Crate to crates.io (OIDC)
    needs: publish-release
    runs-on: ubuntu-24.04
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io via OIDC Trusted Publishing
        if: ${{ vars.CRATES_TRUSTED_PUBLISHING == 'true' }}
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish via OIDC (or verify cargo publish --dry-run until enabled)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
          CRATES_TRUSTED_PUBLISHING: ${{ vars.CRATES_TRUSTED_PUBLISHING }}
        run: |
          if [ "${CRATES_TRUSTED_PUBLISHING:-false}" = "true" ]; then
            test -n "${CARGO_REGISTRY_TOKEN:-}"
            cargo publish --locked
          else
            echo "vars.CRATES_TRUSTED_PUBLISHING != 'true'; verifying crate package cleanly."
            cargo publish --dry-run --allow-dirty
          fi
