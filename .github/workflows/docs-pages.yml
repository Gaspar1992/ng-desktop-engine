name: Deploy Docs Portal (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'packages/**'
      - 'src/**'
      - 'scripts/build-api-docs.mjs'
      - 'angular.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs Portal & API Reference
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run Docs Portal & API Pipeline tests
        run: pnpm run docs:test

      - name: Build Docs Portal & API Reference bundle
        run: |
          pnpm run docs:site
          test -s dist/ng-desktop-docs/browser/index.html
          test -s dist/ng-desktop-docs/browser/404.html
          test -f dist/ng-desktop-docs/browser/.nojekyll
          test -s dist/ng-desktop-docs/browser/api-ts/index.html
          test -s dist/ng-desktop-docs/browser/api-rust/index.html
          test -s dist/ng-desktop-docs/browser/api-rust/ng_native_engine/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ng-desktop-docs/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
