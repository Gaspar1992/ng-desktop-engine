[package]
name = "ng-native-engine"
version = "0.6.0"
edition = "2024"
rust-version = "1.87"
description = "High-performance Native Desktop Rendering Engine for Angular 22+ (GTK4/Libadwaita, WinUI 3, AppKit)"
license = "MIT"
repository = "https://github.com/Gaspar1992/ng-desktop-engine"
documentation = "https://docs.rs/ng-native-engine"
readme = "README.md"
keywords = ["angular", "gtk4", "gui", "desktop", "native"]
categories = ["gui", "web-programming", "rendering::engine"]
include = ["/src/**/*", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lib]
name = "ng_native_engine"
path = "src/lib.rs"

[[bin]]
name = "ng-native-engine"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
unnecessary_literal_bound = "allow"
too_long_first_doc_paragraph = "allow"


