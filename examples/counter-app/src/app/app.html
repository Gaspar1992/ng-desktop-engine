<ng-window id="win" [title]="windowTitle()" (beforeunload)="onBeforeUnload()">
  <ng-header-bar id="hdr" [subtitle]="subtitle()">{{ windowTitle() }}</ng-header-bar>
  <ng-box
    id="vbox"
    class="main-card"
    orientation="vertical"
    spacing="16px"
    hexpand="true"
    vexpand="true"
  >
    <ng-box id="search_bar" class="toolbar-card" orientation="horizontal" spacing="10px">
      <ng-search-entry
        #searchEntry
        id="search_entry"
        hexpand="true"
        placeholder="Buscar Pokémon por nombre o N.º (ej. bul, pika, 25)..."
        [formField]="filterForm.query"
        (cancel)="clearSearch()"
      />
      <ng-spin-button id="poke_id_spin" step="1" [formField]="filterForm.pokeId" />
      <ng-switch id="sw_filter_favorites" [formField]="filterForm.favoritesOnly" />
      <ng-button
        id="btn_filter_favorites"
        class="secondary-action"
        (click)="toggleFavoritesFilter()"
      >
        {{ pokedex.favoritesOnly() ? 'Ver Todos' : '★ Solo Favoritos' }}
      </ng-button>
      <ng-button id="btn_toggle_theme" class="secondary-action" (click)="toggleTheme()">
        {{ theme() === 'dark' ? '☀ Claro' : '☾ Oscuro' }}
      </ng-button>
    </ng-box>

    <ng-spinner id="loading_spinner" [visible]="pokedex.loading()" halign="center" />

    @if (pokedex.errorMessage(); as errMsg) {
    <ng-label id="error_banner" class="error-banner">{{ errMsg }}</ng-label>
    }
    <router-outlet />
  </ng-box>
</ng-window>
